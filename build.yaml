---
# Jellyfin plugin repository metadata (JPRM). The plugin zip carries the tentacle
# binary for each architecture (the shim it installs); scripts/release.sh builds the
# repository's manifest.json from this file and CHANGELOG.md.
# The full history is in CHANGELOG.md; scripts/release.sh reads the release notes from it.
name: "Tentacle"
guid: "3a65d525-990c-4f73-89e9-a0d1500a53d2"
version: "2.0.0.1"
# The 12 build; scripts/build.sh also builds net9.0 for targetAbi 10.11.0.0.
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "crisidev"
overview: "Native remote transcoding: run Jellyfin's ffmpeg jobs on worker nodes"
description: >
  Tentacle brokers Jellyfin's ffmpeg jobs to worker nodes (tentacles) that
  register with the plugin, or runs them locally. It replaces rffmpeg: no ssh,
  no state to go stale, Prometheus metrics, and checks that every worker really
  shares the paths and ffmpeg build it needs.
category: "General"
artifacts:
  - "Jellyfin.Plugin.Tentacle.dll"
  - "Tentacle.Broker.dll"
  - "Tentacle.Protocol.dll"
  - "tentacle-amd64"
  - "tentacle-arm64"
changelog: >
  2.0.0: The server needs only the plugin, from the plugin repository: it
  installs the shim itself (no server mod), for any Jellyfin on Linux. Builds
  for Jellyfin 12.1+ and 10.11. See CHANGELOG.md for the history.
