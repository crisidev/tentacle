# Prometheus alerts for Tentacle. The metrics come from Jellyfin's own /metrics
# (EnableMetrics in system.xml): scrape it as you already do. Plain rule groups:
# load them with rule_files, or paste `groups` into a PrometheusRule spec.
# Tested by tentacle.rules.test.yaml (scripts/build.sh rules = promtool test rules).
groups:
  - name: tentacle
    rules:
      # The rffmpeg failure mode this project exists for: tentacles connected and
      # healthy, yet playback transcodes keep running on the server.
      - alert: TentaclesUnused
        expr: |
          (
            sum(increase(tentacle_placements_total{kind="Transcode",node="local",reason!="least-loaded-local"}[6h]))
            / sum(increase(tentacle_placements_total{kind="Transcode"}[6h]))
          ) > 0.9
          and on () sum(increase(tentacle_placements_total{kind="Transcode"}[6h])) >= 20
          and on () sum(tentacle_node_state{state=~"Ready|Degraded"}) > 0
          and on () max(tentacle_placement_mode{mode="Active"}) == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of transcodes ran on the server, not on tentacles"
          description: >-
            Tentacles are connected and usable, but over the last 6h more than 90% of
            transcodes ran locally because no tentacle could take them (jobs the
            server won on load, with its own slots, do not count). tentacle_placements_total{node="local"} says why
            (path-ineligible, all-busy, no-hardware-tentacle, attach-timeout...); the
            Tentacle dashboard page lists each job with its reason.

      - alert: TentacleNodeDown
        expr: max by (node) (tentacle_node_state{state="Disconnected"}) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tentacle {{ $labels.node }} is disconnected"
          description: >-
            The agent on {{ $labels.node }} connected earlier and is gone: its pod is down,
            it cannot reach the broker on :8097, or its token was rejected (see the agent's
            log). Its jobs run elsewhere or locally meanwhile.

      - alert: TentacleIncompatible
        expr: max by (node) (tentacle_node_state{state="Incompatible"}) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tentacle {{ $labels.node }} runs an incompatible ffmpeg"
          description: >-
            {{ $labels.node }}'s ffmpeg major.minor differs from the server's (or its patch
            level, with strict versions on), so it gets no jobs. Compare
            tentacle_node_info{node="{{ $labels.node }}"} with the server and roll both to
            the same image.

      - alert: TentacleStuck
        expr: max by (node, state) (tentacle_node_state{state=~"Verifying|CoolingDown"}) == 1
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "Tentacle {{ $labels.node }} has been {{ $labels.state }} for 20 minutes"
          description: >-
            Verifying: the agent never answered the share and hardware checks. CoolingDown:
            its jobs keep failing for infrastructure reasons (lost connection, attach
            timeout, spawn errors), so it is benched and re-tested with growing pauses.
            The Jellyfin log has "Tentacle {{ $labels.node }}" lines with the cause.

      - alert: TentacleCheckFailing
        expr: min by (node, check) (tentacle_node_check{required="true"}) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tentacle {{ $labels.node }} fails check {{ $labels.check }}"
          description: >-
            The tentacle is Degraded: a required check failed at its last verification.
            root:<path> means the directory is not the same on the tentacle and the server
            (missing mount, different volume, not writable); hardware:<type> means the
            GPU self-test failed; uid means files would be written as another user. The
            dashboard page shows the detail; "Verify" re-runs the checks.

      - alert: TentacleTranscodeFailures
        expr: |
          sum by (node) (increase(tentacle_jobs_total{kind="Transcode",outcome=~"error|lost|failed"}[1h])) >= 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} transcodes failed on {{ $labels.node }} in the last hour"
          description: >-
            error: ffmpeg exited non-zero (it returns AVERROR & 0xff: 237 = ENODEV, usually
            the GPU; 234 = EINVAL; 254 = ENOENT, a path missing on that host). lost: the
            tentacle went away mid-job. failed: it could not start ffmpeg. Jellyfin's log
            for each one is /config/log/FFmpeg.Transcode-*.log; the tentacle_job log lines
            carry the job id and exit code.

      - alert: TentaclePathIneligible
        expr: sum by (kind) (increase(tentacle_placements_total{reason="path-ineligible"}[1h])) > 0
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.kind }} jobs ran locally: a path is not shared with any tentacle"
          description: >-
            A job used a file outside every directory the tentacles proved they share, so
            it ran on the server. The path is in the job's reason on the dashboard page
            and in the tentacle_job log line. Share that directory (same path on every
            tentacle) or add it to the plugin's extra shared directories.

      - alert: TentacleCapacity
        expr: sum(increase(tentacle_placements_total{reason=~"all-busy|background-slots-full"}[1h])) >= 10
        labels:
          severity: info
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} jobs ran locally in the last hour because every tentacle was full"
          description: >-
            Raise TENTACLE_MAX_JOBS / TENTACLE_MAX_BACKGROUND_JOBS on the tentacles if they
            have headroom, or add one.

      - alert: TentacleBrokerDown
        expr: absent(tentacle_broker_up == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The Tentacle broker is not running"
          description: >-
            Either Jellyfin is not exporting metrics (it is down, EnableMetrics is off, or
            the plugin is not loaded), or the broker could not listen on its socket or
            :8097 (the dashboard page shows the error). Every job runs on the server.
