# What the Jellyfin server's Deployment needs for Tentacle (a strategic merge
# patch: kubectl -n jellyfin patch deployment jellyfin --patch-file this-file).
# Its /config must be the "jellyfin-config" volume the workers mount, so the
# shared directories are the same files on both sides. Install the plugin from
# https://github.com/crisidev/tentacle/releases/latest/download/manifest.json.
spec:
  template:
    spec:
      containers:
        - name: jellyfin
          env:
            # Runs the shim the plugin installs, through Jellyfin's supported
            # setting (without it the plugin switches Jellyfin over itself). Add it
            # once the plugin is installed. For the official image: JELLYFIN_FFMPEG.
            - { name: FFMPEG_PATH, value: /config/data/data/tentacle/bin/ffmpeg }
            # Trickplay and image extraction write under $TMPDIR/jellyfin, which
            # must be shared; /tmp is not.
            - { name: TMPDIR, value: /config/cache/temp }
            - name: TENTACLE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TENTACLE_TOKEN
              valueFrom:
                secretKeyRef: { name: tentacle-token, key: token }
            # Optional: the token being rotated out stays valid while this is set.
            - name: TENTACLE_PREVIOUS_TOKEN
              valueFrom:
                secretKeyRef: { name: tentacle-token, key: previous, optional: true }
          ports:
            - { name: tentacle, containerPort: 8097 }
