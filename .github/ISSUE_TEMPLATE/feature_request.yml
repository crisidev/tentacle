name: Feature request
description: Something Tentacle could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Server and tentacle hardware, how you deploy it.
