version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Jellyfin.Controller/Model must match the targetAbi in build.yaml, so their
  # major and minor updates are a deliberate change, not a Dependabot PR.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "Jellyfin.*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "prometheus-net*"
