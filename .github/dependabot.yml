version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Jellyfin.Controller/Model must match the targetAbi in build.yaml and stay on
  # the oldest release of each line (see Directory.Packages.props), so every
  # update, patches included, is a deliberate change, not a Dependabot PR.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "Jellyfin.*"
      - dependency-name: "prometheus-net*"
